<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarForge: The Void</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0022;
      }
      #battle3d {
        position: fixed;
        display: none;
        pointer-events: none;
        z-index: 0;
      }
      #game {
        width: 100vw;
        height: 100vh;
        position: relative;
        z-index: 2;
        background: transparent;
      }
      #react-root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        pointer-events: none;
      }
      #react-root > * {
        pointer-events: all;
      }
    </style>
  </head>
  <body>
    <canvas id="battle3d"></canvas>
    <div id="game"></div>
    <div id="react-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
